<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Card shadow and body -->
  <rect x="34" y="40" width="732" height="430" rx="28" fill="#16352A" opacity="0.25"/>
  <rect x="24" y="24" width="732" height="430" rx="28" fill="#1F4A3A"/>

  <!-- Gold band with tiger-stripe cut-outs on the left edge -->
  <path d="M52 24h112v430H52a28 28 0 0 1-28-28V52a28 28 0 0 1 28-28z" fill="#D9A034"/>
  <g fill="#1F4A3A">
