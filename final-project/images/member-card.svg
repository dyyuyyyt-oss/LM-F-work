    <path d="M24 176c48 4 92-6 140-26v18c-50 24-92 32-140 28z"/>
    <path d="M24 262c44 2 88-4 140-20v20c-52 16-96 20-140 18z"/>
    <path d="M24 350c46 6 90 0 140-18v18c-50 20-94 26-140 20z"/>
  </g>

  <!-- Paw print logo -->
  <g transform="translate(640 70)">
