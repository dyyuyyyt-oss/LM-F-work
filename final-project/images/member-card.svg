      <ellipse cx="27.5" cy="20" rx="4.3" ry="5.6" transform="rotate(-6 27.5 20)"/>
      <ellipse cx="36.5" cy="20" rx="4.3" ry="5.6" transform="rotate(6 36.5 20)"/>
      <ellipse cx="43.5" cy="27" rx="4.2" ry="5.4" transform="rotate(20 43.5 27)"/>
      <path d="M32 30.5c-5.2 0-11 6.6-11 11.6 0 3.6 2.8 5.6 6 5.6 2.2 0 3.4-1.1 5-1.1s2.8 1.1 5 1.1c3.2 0 6-2 6-5.6 0-5-5.8-11.6-11-11.6z"/>
    </g>
